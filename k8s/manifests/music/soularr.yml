# Soularr — every SCRIPT_INTERVAL seconds, searches Soulseek (via slskd) for Lidarr's missing
# albums, downloads the best match and tells Lidarr to import it. No UI.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soularr
  namespace: music
  labels:
    app: soularr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soularr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: soularr
    spec:
      nodeSelector:
        storage-type: media
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Soularr keeps its state files next to config.ini in /data, so the Secret is copied
        # into the writable volume instead of being mounted there directly
        - name: config
          image: alpine:3.24.2
          command: ["/bin/sh", "-c", "cp /secret/config.ini /data/config.ini"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /secret
              readOnly: true
      containers:
        - name: soularr
          image: mrusse08/soularr:v1.2.3
          env:
            - name: SCRIPT_INTERVAL
              value: "300"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soularr-data
        - name: config
          secret:
            secretName: soularr-config
        - name: downloads
          hostPath:
            path: /mnt/media/downloads/soulseek
            type: Directory
