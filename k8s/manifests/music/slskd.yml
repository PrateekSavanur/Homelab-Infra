# slskd — Soulseek client with a web UI and API. Soularr drives it; you can also search by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: music
  labels:
    app: slskd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slskd
  strategy:
    type: Recreate          # one Soulseek login per account
  template:
    metadata:
      labels:
        app: slskd
    spec:
      nodeSelector:
        storage-type: media
      securityContext:
        # Same UID as Lidarr/Soularr so imports can move the downloaded files
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: slskd
          image: slskd/slskd:0.26.2
          ports:
            - name: http
              containerPort: 5030
            # Incoming peer connections. Forward TCP 50300 on the router to k3s-worker-2
            # (192.168.68.112) for better search results and download speeds.
            - name: soulseek
              containerPort: 50300
              hostPort: 50300
          env:
            - name: SLSKD_SLSK_LISTEN_PORT
              value: "50300"
            - name: SLSKD_DOWNLOADS_DIR
              value: "/downloads"
            # Sharing back is expected on Soulseek; many peers refuse users who share nothing.
            # Remove this to share nothing.
            - name: SLSKD_SHARED_DIR
              value: "/data/music"
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: music-secrets
                  key: SLSK_USERNAME
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-secrets
                  key: SLSK_PASSWORD
            - name: SLSKD_USERNAME
              value: "admin"
            - name: SLSKD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-secrets
                  key: SLSKD_WEB_PASSWORD
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: music-secrets
                  key: SLSKD_API_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: app
              mountPath: /app
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /data/music
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 5030
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 5030
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: app
          persistentVolumeClaim:
            claimName: slskd-data
        # Same path in slskd, Soularr and Lidarr so Soularr's import paths resolve in all three
        - name: downloads
          hostPath:
            path: /mnt/media/downloads/soulseek
            type: Directory
        - name: music
          hostPath:
            path: /mnt/media/library/music
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: music
  labels:
    app: slskd
spec:
  selector:
    app: slskd
  ports:
    - name: http
      port: 5030
      targetPort: 5030
