# App state on the SSD (k3s local-path). Pinned to the media node by each workload's
# nodeSelector, next to the HDD paths they share.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-data
  namespace: music
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
