# LAN + Tailscale only: home.prateeksavanur.dev has no public DNS and is NOT routed
# through the Cloudflare Tunnel. Keep it that way.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music
  namespace: music
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: lidarr.home.prateeksavanur.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lidarr
                port:
                  number: 8686
    - host: slskd.home.prateeksavanur.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: slskd
                port:
                  number: 5030
