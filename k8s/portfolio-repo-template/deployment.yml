# =============================================================
# ADD THIS k8s/ DIRECTORY TO YOUR PORTFOLIO REPO
# ArgoCD will watch it and auto-deploy on every git push
# =============================================================
#
# Your portfolio repo structure should look like:
#   portfolio/
#   ├── src/              (your website source)
#   ├── Dockerfile        (builds your site image)
#   ├── .github/
#   │   └── workflows/
#   │       └── deploy.yml  (builds + pushes image, then updates image tag below)
#   └── k8s/
#       ├── deployment.yml   ← this file
#       ├── service.yml
#       └── ingress.yml
#
# IMAGE TAG WORKFLOW:
#   GitHub Actions builds image  →  pushes to ghcr.io/YOUR_USERNAME/portfolio:sha-xxxxx
#   Then runs: sed -i "s|image:.*|image: ghcr.io/YOUR_USERNAME/portfolio:${{ github.sha }}|" k8s/deployment.yml
#   git commit + push  →  ArgoCD detects change  →  auto-deploys
# =============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: homelab
  labels:
    app: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          # Replace with your actual image — GitHub Actions updates this tag automatically
          image: ghcr.io/YOUR_USERNAME/portfolio:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
