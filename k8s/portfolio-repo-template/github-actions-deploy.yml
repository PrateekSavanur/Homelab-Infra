# =============================================================
# ADD THIS FILE TO YOUR PORTFOLIO REPO:
#   .github/workflows/deploy.yml
#
# It builds your Docker image, pushes to GitHub Container Registry,
# then updates the image tag in k8s/deployment.yml and pushes back.
# ArgoCD detects the git change and auto-deploys within ~3 minutes.
# =============================================================

name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-username/portfolio

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated image tag back
      packages: write       # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update image tag in k8s/deployment.yml
        run: |
          NEW_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          sed -i "s|image: .*portfolio.*|image: ${NEW_IMAGE}|" k8s/deployment.yml

      - name: Commit and push updated image tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yml
          git diff --cached --quiet || git commit -m "chore: update image to ${{ github.sha }}"
          git push
