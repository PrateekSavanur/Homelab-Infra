---
all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_become: true
    ansible_become_method: sudo
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  children:
    # ── k3s cluster ─────────────────────────────────────────────
    k3s_cluster:
      children:
        k3s_master:
          hosts:
            k3s-master-1:
              ansible_host: 192.168.68.110

        k3s_workers:
          hosts:
            k3s-worker-1:
              ansible_host: 192.168.68.111
              has_media_disk: false

            k3s-worker-2:
              ansible_host: 192.168.68.112
              has_media_disk: true       # 4 TB HDD data disk attached here
              media_disk_device: /dev/sdb
              node_label_media: "true"

    # ── AdGuard LXC ─────────────────────────────────────────────
    adguard_hosts:
      hosts:
        adguard:
          ansible_host: 192.168.68.50
          ansible_user: root           # Debian LXC default
