---
- name: Update apt cache and dist-upgrade
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - vim
      - htop
      - git
      - unzip
      - jq
      - net-tools
      - iptables
      - ipset
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - nfs-common
      - open-iscsi     # required by Longhorn / iSCSI storage
      - cryptsetup
      - qemu-guest-agent
    state: present

- name: Enable and start qemu-guest-agent
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  # LXC containers do not have qemu-guest-agent
  when: "'adguard_hosts' not in group_names"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Disable swap (k3s requirement)
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: ansible_swaptotal_mb > 0

- name: Remove swap entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  when: "'k3s_cluster' in group_names"

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  when: "'k3s_cluster' in group_names"

- name: Apply sysctl settings for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { key: "net.bridge.bridge-nf-call-iptables",  value: "1" }
    - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { key: "net.ipv4.ip_forward",                 value: "1" }
  when: "'k3s_cluster' in group_names"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: "'adguard_hosts' not in group_names"

- name: Update /etc/hosts with hostname
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"
    state: present

- name: Harden SSH — disable password auth and root login for VMs
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
  loop:
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?X11Forwarding',          line: 'X11Forwarding no' }
    - { regexp: '^#?PermitRootLogin',        line: 'PermitRootLogin no' }
  notify: Restart SSH
  # LXC adguard container needs root SSH so we skip it there
  when: "'adguard_hosts' not in group_names"

- name: Remove unneeded packages
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
