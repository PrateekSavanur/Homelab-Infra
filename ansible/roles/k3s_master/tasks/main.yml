---
# ── Prepare config directory ──────────────────────────────────────
- name: Create /etc/rancher/k3s directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Write k3s server config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"

# ── Install k3s ───────────────────────────────────────────────────
- name: Check if k3s binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download and install k3s server
  ansible.builtin.shell:
    cmd: |
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="{{ k3s_version }}" \
        sh -s - server
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Enable and start k3s service
  ansible.builtin.service:
    name: k3s
    state: started
    enabled: true

- name: Wait for k3s API server to be reachable
  ansible.builtin.wait_for:
    host: "{{ k3s_master_ip }}"
    port: 6443
    delay: 10
    timeout: 300

- name: Wait until master node is Ready
  ansible.builtin.shell: >
    k3s kubectl get node {{ inventory_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 24
  delay: 10
  changed_when: false

# ── kubeconfig ────────────────────────────────────────────────────
- name: Create .kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/{{ ansible_user }}/.kube
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0700"

- name: Copy kubeconfig for ubuntu user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/{{ ansible_user }}/.kube/config
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Patch kubeconfig server address (localhost → LAN IP)
  ansible.builtin.replace:
    path: /home/{{ ansible_user }}/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_master_ip }}:6443"

- name: Fetch kubeconfig to local workstation
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig.yaml"
    flat: true

- name: Patch fetched kubeconfig server address
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/../../kubeconfig.yaml"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ k3s_master_ip }}:6443"
  delegate_to: localhost
  become: false
  vars:
    ansible_become: false

# ── Helm ──────────────────────────────────────────────────────────
- name: Check if Helm is installed
  ansible.builtin.stat:
    path: /usr/local/bin/helm
  register: helm_bin

- name: Install Helm
  ansible.builtin.shell:
    cmd: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    creates: /usr/local/bin/helm
  when: not helm_bin.stat.exists
  environment:
    DESIRED_VERSION: "{{ helm_version }}"

# ── MetalLB ───────────────────────────────────────────────────────
- name: Add MetalLB Helm repo
  ansible.builtin.shell: |
    helm repo add metallb https://metallb.github.io/metallb
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install MetalLB via Helm
  ansible.builtin.shell: |
    helm upgrade --install metallb metallb/metallb \
      --namespace metallb-system \
      --create-namespace \
      --wait \
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: metallb_install
  changed_when: "'deployed' in metallb_install.stdout or 'upgraded' in metallb_install.stdout"

- name: Wait for MetalLB webhook to be ready
  ansible.builtin.shell: |
    kubectl -n metallb-system wait --for=condition=ready pod \
      --selector=app.kubernetes.io/component=controller \
      --timeout=120s
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Configure MetalLB IP address pool
  ansible.builtin.shell: |
    kubectl apply -f - <<'EOF'
    apiVersion: metallb.io/v1beta1
    kind: IPAddressPool
    metadata:
      name: homelab-pool
      namespace: metallb-system
    spec:
      addresses:
        - {{ metallb_ip_range }}
    ---
    apiVersion: metallb.io/v1beta1
    kind: L2Advertisement
    metadata:
      name: homelab-l2advert
      namespace: metallb-system
    spec:
      ipAddressPools:
        - homelab-pool
    EOF
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# ── Traefik (ingress controller) ──────────────────────────────────
- name: Add Traefik Helm repo
  ansible.builtin.shell: |
    helm repo add traefik https://traefik.github.io/charts
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install Traefik via Helm
  ansible.builtin.shell: |
    helm upgrade --install traefik traefik/traefik \
      --namespace traefik \
      --create-namespace \
      --set service.type=LoadBalancer \
      --set ports.web.http.redirections.entryPoint.to=websecure \
      --set ports.web.http.redirections.entryPoint.scheme=https \
      --set ports.web.http.redirections.entryPoint.permanent=true \
      --wait \
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: traefik_install
  changed_when: "'deployed' in traefik_install.stdout or 'upgraded' in traefik_install.stdout"

# ── cert-manager ──────────────────────────────────────────────────
- name: Add cert-manager Helm repo
  ansible.builtin.shell: |
    helm repo add jetstack https://charts.jetstack.io
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install cert-manager via Helm
  ansible.builtin.shell: |
    helm upgrade --install cert-manager jetstack/cert-manager \
      --namespace cert-manager \
      --create-namespace \
      --set crds.enabled=true \
      --wait \
      --timeout 5m
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: cm_install
  changed_when: "'deployed' in cm_install.stdout or 'upgraded' in cm_install.stdout"
