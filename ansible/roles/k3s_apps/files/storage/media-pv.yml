# HostPath PersistentVolume — backed by the 4 TB HDD on worker-2
# nodeAffinity ensures this PV is only used on the media node
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
  labels:
    type: local
    storage-type: media
spec:
  storageClassName: local-media
  capacity:
    storage: 1800Gi          # leave headroom from the 2 TB disk
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/media/jellyfin
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage-type
              operator: In
              values:
                - media
